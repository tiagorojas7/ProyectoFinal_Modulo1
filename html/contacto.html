<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <title>Contacto</title>
  </head>
  <body>
    <!-- BARRA DE NAVEGACION -->
    <header>
      <ul class="nav nav-tabs">
        <li class="nav-item">
          <a class="nav-link" href="./index.html">Inicio</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="./stack.html">Herramientas</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="./educacion.html"
            >Educación / Experiencia</a
          >
        </li>
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="./contacto.html"
            >Contacto</a
          >
        </li>
      </ul>
    </header>

    <main>
      <!-- SECCION TITULO Y SUBTITULO -->
      <section class="Titulo-seccion">
        <h1>PONGAMONOS EN CONTACTO</h1>
        <p class="text-secondary">
          Abierto a nuevas experiencias y oportunidades.
        </p>
      </section>

      <!-- SECCION FORMULARIO -->
      <section class="formulario">
        <div>
          <h6>
            Si sos reclutador, rellená los datos y me pondré en contacto contigo
            inmediatamente
          </h6>
        </div>
        <form>
          <!-- Primer Campo -->
          <div class="dato dato-1">
            <label for="Nombre">Nombre</label>
            <input type="text" id="Nombre" placeholder="EJ: Juan Pérez" />
          </div>

          <!-- Segundo Campo -->
          <div class="dato dato-2">
            <label for="Gmail">Gmail</label>
            <input
              type="email"
              id="Gmail"
              placeholder="EJ: juanperez@gmail.com"
            />
          </div>
          <!-- tercero -->
          <div class="dato dato-3">
            <label for="Puesto">Puesto Laboral</label>
            <input
              type="text"
              id="Puesto"
              placeholder="EJ: Desarrollador Full Stack Junior"
            />
          </div>

          <!-- Cuarto Campo -->
          <div class="dato dato-4">
            <button type="submit">Enviar</button>
          </div>
        </form>
      </section>

      <!-- botones cta -->
      <div class="contenedor-botones">
        <button type="button" class="btn btn-dark">VER CV</button>
        <button type="button" class="btn btn-dark">DESCARGAR CV</button>
      </div>

      <div class="gmail">
        <h4>Gmail: Tiagorojas1602@gmail.com</h4>
        <a
          href="mailto:Tiagorojas1602@gmail.com"
          class="btn btn-primary"
          role="button"
          >Redactar Gmail</a
        >
      </div>
    </main>

    <!-- PIE DE PAGINA -->
    <footer class="footer py-4 mt-5">
      <div class="container">
        <ul
          class="nav d-flex justify-content-between align-items-center w-100 p-0 m-0 gap-3"
        >
          <li class="nav-item">
            <a
              target="_blank"
              href="https://www.linkedin.com/"
              class="btn btn-outline-dark rounded-circle p-2 d-flex align-items-center justify-content-center"
            >
              <i class="bi bi-linkedin fs-4"></i>
            </a>
          </li>

          <li class="nav-item">
            <a
              target="_blank"
              href="https://www.github.com/"
              class="btn btn-outline-dark rounded-circle p-2 d-flex align-items-center justify-content-center"
            >
              <i class="bi bi-github fs-4"></i>
            </a>
          </li>

          <li class="nav-item">
            <a
              target="_blank"
              href="https://mail.google.com/"
              class="btn btn-outline-dark rounded-circle p-2 d-flex align-items-center justify-content-center"
            >
              <i class="bi bi-envelope-fill fs-4"></i>
            </a>
          </li>
        </ul>
      </div>
    </footer>
  </body>
</html>
